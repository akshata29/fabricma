version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:-placeholder}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-placeholder}
        VITE_AZURE_BACKEND_SCOPE: ${VITE_AZURE_BACKEND_SCOPE:-placeholder}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
