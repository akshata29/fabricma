[project]
name = "fabricma-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "azure-ai-projects>=2.0.0",
    "azure-identity>=1.16",
    "agent-framework>=1.2.2",
    "msal>=1.28",
    "PyJWT[crypto]>=2.8",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "sse-starlette>=1.6",
    # Teams / Bot Framework channel integration
    "botbuilder-core>=4.16",
    "botbuilder-schema>=4.16",
]

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "ruff>=0.4",
    "tqdm>=4.66",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
